# Cloudflare Workers config for Showcase Scorer. Deploy from this folder with:  npx wrangler deploy
name = "showcase-scorer"
main = "_worker.js"
compatibility_date = "2026-10-01"

# The app's files (this folder). Server code, tests, scripts and docs are excluded via .assetsignore.
[assets]
directory = "."
binding = "ASSETS"

# Option A (recommended): Google Gemini free tier. Add the key as a secret, never in this file:
#   npx wrangler secret put GEMINI_API_KEY
[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"

# Problem reports ("Report a problem" button). Create a KV namespace, then uncomment and add its id:
#   npx wrangler kv namespace create showcase-reports
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "<your KV namespace id>"
# The triage feed (/api/reports) also needs an admin key, set as a secret:
#   npx wrangler secret put ADMIN_TOKEN

# Option B: Cloudflare Workers AI (no key; uses your account's free daily allowance).
# Uncomment to enable. It's used only when GEMINI_API_KEY isn't set.
# [ai]
# binding = "AI"

# Per-visitor rate limit for /api/read (recommended before sharing the link publicly).
# Check Cloudflare's current docs for this block's exact syntax if deploy rejects it.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 10, period = 60 }
